ward_search_terms: ["South Africa", "Electoral Ward", "2020"]
worldpop_url_2022: "https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/2022/ZAF/v1/100m/constrained/zaf_pop_2022_CN_100m_R2025A_v1.tif"
